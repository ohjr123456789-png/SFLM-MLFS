<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기록보관소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f1; --paper:#fffdfa; --ink:#3b2f33; --muted:#8a7a7e; --line:#efe3dc;
  --rose:#e2677e; --rose-soft:#fbe4e8; --rose-deep:#c44d65; --shadow:0 2px 14px rgba(90,50,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}

/* header */
header{padding:36px 0 18px;text-align:center}
.names{font-family:"Gowun Batang",serif;font-size:15px;color:var(--muted);letter-spacing:.04em;min-height:24px}
.dday{font-family:"Gowun Batang",serif;font-weight:700;font-size:44px;color:var(--rose);line-height:1.15;margin:4px 0}
.dday small{font-size:16px;color:var(--muted);font-weight:400;display:block;margin-top:4px}
h1{font-family:"Gowun Batang",serif;font-size:26px;margin:6px 0 2px}
.stats{color:var(--muted);font-size:14px}
.set-link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;margin-top:6px;padding:4px}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.search{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 16px;outline:none}
.search:focus{border-color:var(--rose)}
.btn{border:none;border-radius:999px;padding:10px 18px;background:var(--rose);color:#fff;font-weight:600;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--rose-deep)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4ebe5}
.btn.danger{background:transparent;color:var(--rose-deep);border:1px solid #f0c7cf}
.btn.danger:hover{background:var(--rose-soft)}

.status{font-size:14px;color:var(--rose-deep);text-align:center;min-height:0}
.status:not(:empty){padding:10px;background:var(--rose-soft);border-radius:12px;margin:8px 0}

/* timeline */
.month{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:flex;gap:16px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;cursor:pointer;border:1px solid transparent;transition:transform .15s,border-color .15s;text-align:left;width:100%}
.card:hover{transform:translateY(-2px);border-color:var(--rose-soft)}
.cover{flex:0 0 132px;height:132px;border-radius:12px;overflow:hidden;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
.cover .count{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.card-body{flex:1;min-width:0}
.card-date{font-size:13px;color:var(--muted)}
.card-title{font-family:"Gowun Batang",serif;font-weight:700;font-size:19px;margin:2px 0 4px;display:flex;gap:6px;align-items:center}
.card-place{font-size:14px;color:var(--rose-deep);margin-bottom:4px}
.card-text{font-size:15px;color:#5a4b50;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:54px}
.empty p{margin:8px 0 18px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(40,25,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 14px}
.overlay.open{display:flex}
.sheet{background:var(--paper);border-radius:22px;width:100%;max-width:640px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);margin:auto 0}
.sheet h2{font-family:"Gowun Batang",serif;margin:0 0 16px;font-size:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--rose)}
.field textarea{min-height:180px;resize:vertical;line-height:1.7}
.row{display:flex;gap:12px}
.row .field{flex:1}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;padding:0}
.mood.on{border-color:var(--rose);background:var(--rose-soft)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f3e9e4}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
.thumb .x:disabled{display:none}
.thumb .badge{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:6px;padding:0 5px}
.thumb .prog{position:absolute;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);text-align:center;padding:4px}
.vph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;background:#3b2f33}
.lb-msg{color:#eee;font-size:15px}
.add-media{aspect-ratio:1;border-radius:12px;border:1.5px dashed #e3c6cd;background:#fff;color:var(--rose);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.add-media b{font-size:26px;line-height:1}
.drop-hint{font-size:12px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .spacer{flex:1}

/* viewer */
.v-date{color:var(--muted);font-size:14px}
.v-title{font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;margin:2px 0 4px}
.v-place{color:var(--rose-deep);font-size:15px;margin-bottom:14px}
.v-text{white-space:pre-wrap;font-size:16px;line-height:1.85;margin:16px 0;font-family:"Gowun Batang",serif}
.v-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.v-gallery .thumb{cursor:zoom-in}

/* lightbox */
#lightbox{background:rgba(10,5,8,.92);align-items:center;padding:0;z-index:70}
#lightbox .lb-media{max-width:94vw;max-height:86vh;display:flex;align-items:center;justify-content:center}
#lightbox img,#lightbox video{max-width:94vw;max-height:86vh;border-radius:8px}
.lb-btn{position:fixed;background:rgba(255,255,255,.15);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:22px}
.lb-btn:hover{background:rgba(255,255,255,.28)}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}
.lb-close{right:14px;top:14px}
.lb-count{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#ddd;font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  .dday{font-size:36px}
  .cover{flex-basis:96px;height:96px}
  .card{gap:12px;padding:12px}
  .card-title{font-size:17px}
  .row{flex-direction:column;gap:0}
  .sheet{padding:18px}
  .toolbar .btn span{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="names" id="names"></div>
    <div class="dday" id="dday"></div>
    <h1 id="mainTitle">기록보관소</h1>
    <div class="stats" id="stats"></div>
    <button class="set-link" id="openSettings">처음 만난 날 · 이름 설정</button>
  </header>

  <div class="status" id="status"></div>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="제목, 장소, 내용으로 찾기">
    <button class="btn" id="newBtn">＋<span> 새 기록</span></button>
  </div>

  <main id="list"><div class="empty"><p>불러오는 중…</p></div></main>
</div>

<!-- editor -->
<div class="overlay" id="editor">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="edHeading">새 기록</h2>
    <div class="row">
      <div class="field"><label for="edDate">날짜</label><input id="edDate" type="date"></div>
      <div class="field"><label for="edPlace">장소</label><input id="edPlace" placeholder="예) 성수동 카페, 한강공원"></div>
    </div>
    <div class="field"><label for="edTitle">제목</label><input id="edTitle" placeholder="오늘을 한 줄로"></div>
    <div class="field"><label>오늘의 기분</label><div class="moods" id="moods"></div></div>
    <div class="field"><label for="edText">그날의 일기</label><textarea id="edText" placeholder="오늘 있었던 일, 나눈 이야기, 기억하고 싶은 순간들…"></textarea></div>
    <div class="field">
      <label>사진 · 영상</label>
      <div class="media-grid" id="edMedia"></div>
      <div class="drop-hint">여러 개를 한 번에 고를 수 있어요. 사진은 자동으로 줄여서 올려요. 영상은 최대 500MB까지, 큰 영상은 시간이 좀 걸려요</div>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
    </div>
    <div class="actions">
      <button class="btn ghost" id="edCancel">취소</button>
      <button class="btn" id="edSave">저장</button>
    </div>
  </div>
</div>

<!-- viewer -->
<div class="overlay" id="viewer">
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="vBody"></div>
    <div class="actions">
      <button class="btn danger" id="vDelete">삭제</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="vClose">닫기</button>
      <button class="btn" id="vEdit">수정</button>
    </div>
  </div>
</div>

<!-- settings -->
<div class="overlay" id="settingsBox">
  <div class="sheet" role="dialog" aria-modal="true" style="max-width:440px">
    <h2>우리 정보</h2>
    <div class="field"><label for="sNames">두 사람 이름</label><input id="sNames" placeholder="예) 지훈 ♥ 서연"></div>
    <div class="field"><label for="sStart">처음 만난 날 (사귄 날)</label><input id="sStart" type="date"></div>
    <div class="field"><label for="sTitle">보관소 이름</label><input id="sTitle" placeholder="기록보관소"></div>
    <div class="actions">
      <button class="btn danger" id="sLogout">로그아웃</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="sCancel">취소</button>
      <button class="btn" id="sSave">저장</button>
    </div>
  </div>
</div>

<!-- login -->
<div class="overlay" id="loginBox" style="align-items:center;background:var(--bg)">
  <form class="sheet" id="loginForm" style="max-width:380px" autocomplete="on">
    <h2 style="text-align:center">💌 우리의 기록보관소</h2>
    <div class="field"><label for="lEmail">이메일</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPw">비밀번호</label><input id="lPw" type="password" autocomplete="current-password" required></div>
    <div class="status" id="loginMsg"></div>
    <div class="actions"><button class="btn" id="lBtn" type="submit" style="width:100%">들어가기</button></div>
  </form>
</div>

<!-- confirm -->
<div class="overlay" id="confirmBox" style="align-items:center">
  <div class="sheet" style="max-width:380px;text-align:center">
    <p id="confirmMsg" style="margin:4px 0 6px;font-size:17px"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn ghost" id="cNo">취소</button>
      <button class="btn" id="cYes">삭제할게요</button>
    </div>
  </div>
</div>

<!-- lightbox -->
<div class="overlay" id="lightbox">
  <div class="lb-media" id="lbMedia"></div>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="이전">‹</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="다음">›</button>
  <button class="lb-btn lb-close" id="lbClose" aria-label="닫기">✕</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
<script>
/* ★ 여기에 Firebase 콘솔의 firebaseConfig 값을 붙여넣으세요 ★ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const $ = s => document.querySelector(s);
const MOODS = ['🥰','😊','😂','🥹','😍','😌','😴','😤','😢','🍽️','☕','🎬','🌸','🌙'];
let db = null, assets = null, entries = [], settings = {}, loaded = false, editable = true;
let viewingId = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blobUrl = id => id; // Firebase Storage 다운로드 주소를 그대로 사용
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d);
  return `${y}년 ${m}월 ${d}일 (${WD[dt.getDay()]})`;
}
function setStatus(msg){ $('#status').textContent = msg || ''; }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }
function open(id){ $(id).classList.add('open'); document.body.style.overflow='hidden'; }
function close(id){ $(id).classList.remove('open'); if(!document.querySelector('.overlay.open')) document.body.style.overflow=''; }

/* ---------- header ---------- */
function renderHeader(){
  $('#names').textContent = settings.names || '';
  const title = settings.title || '기록보관소';
  $('#mainTitle').textContent = title; document.title = title;
  if(settings.startDate){
    const [y,m,d] = settings.startDate.split('-').map(Number);
    const start = new Date(y, m-1, d), now = new Date(); now.setHours(0,0,0,0);
    const n = Math.round((now - start) / 86400000) + 1;
    $('#dday').innerHTML = (n >= 1 ? `D+${n.toLocaleString()}` : `D-${(1-n).toLocaleString()}`) + `<small>${fmtDate(settings.startDate)}부터</small>`;
  } else $('#dday').innerHTML = '';
  const photos = entries.reduce((a,e)=>a + (e.media||[]).filter(m=>m.type==='image').length, 0);
  const videos = entries.reduce((a,e)=>a + (e.media||[]).filter(m=>m.type==='video').length, 0);
  $('#stats').textContent = loaded ? `추억 ${entries.length}개 · 사진 ${photos}장 · 영상 ${videos}개` : '';
}

/* ---------- list ---------- */
function mediaTag(m, extra=''){
  if(m.type !== 'video') return `<img src="${esc(blobUrl(m.id))}" alt="" loading="lazy" ${extra}>`;
  if(m.poster) return `<img src="${esc(blobUrl(m.poster))}" alt="" loading="lazy" ${extra}>`;
  if(m.id) return `<video src="${esc(blobUrl(m.id))}#t=0.1" preload="metadata" muted playsinline ${extra}></video>`;
  return `<div class="vph">🎬</div>`;
}
/* every stored file a media item uses (single file, chunks of a big video, poster) */
const assetIds = m => [m.id, m.poster, ...(m.chunks||[])].filter(Boolean);
const CHUNK = Infinity; // Firebase Storage는 큰 파일도 한 번에 올릴 수 있어요
const MAX_VIDEO = 500 * 1024 * 1024;
const fmtMB = b => (b / 1048576).toFixed(b > 10485760 ? 0 : 1) + 'MB';
/* big videos are stored in pieces; fetch and join them back into one playable file */
const vidCache = new Map();
async function videoSrc(m, onProg){
  if(!m.chunks) return blobUrl(m.id);
  const key = m.chunks[0];
  if(vidCache.has(key)) return vidCache.get(key);
  const parts = [];
  for(let i = 0; i < m.chunks.length; i++){
    onProg && onProg(i, m.chunks.length);
    const r = await fetch(blobUrl(m.chunks[i]));
    if(!r.ok) throw new Error('chunk ' + i);
    parts.push(await r.blob());
  }
  const url = URL.createObjectURL(new Blob(parts, { type: m.mime || 'video/mp4' }));
  vidCache.set(key, url);
  return url;
}
function makePoster(file){
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(file);
    let finished = false;
    const done = b => { if(finished) return; finished = true; clearTimeout(to); URL.revokeObjectURL(url); res(b); };
    const to = setTimeout(() => done(null), 8000);
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = () => {
      try{
        const s = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(v.videoWidth * s) || 320; c.height = Math.round(v.videoHeight * s) || 240;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(b => done(b), 'image/jpeg', 0.82);
      }catch(_){ done(null); }
    };
    v.onerror = () => done(null);
  });
}
function render(){
  renderHeader();
  const list = $('#list');
  if(!loaded){ list.innerHTML = '<div class="empty"><p>불러오는 중…</p></div>'; return; }
  const q = $('#search').value.trim().toLowerCase();
  const shown = entries.filter(e => !q || [e.title,e.place,e.text].some(v => (v||'').toLowerCase().includes(q)));
  if(!entries.length){
    list.innerHTML = `<div class="empty"><div class="big">💌</div><p>아직 기록이 없어요.<br>첫 추억부터 남겨볼까요?</p>${editable?'<button class="btn" id="emptyNew">첫 기록 쓰기</button>':''}</div>`;
    const b = $('#emptyNew'); if(b) b.onclick = () => openEditor(null);
    return;
  }
  if(!shown.length){ list.innerHTML = '<div class="empty"><p>찾는 기록이 없어요.</p></div>'; return; }
  let html = '', lastMonth = '';
  for(const e of shown){
    const [y,m] = (e.date||'').split('-');
    const mk = y + '-' + m;
    if(mk !== lastMonth){ html += `<div class="month">${Number(y)}년 ${Number(m)}월</div>`; lastMonth = mk; }
    const media = e.media || [];
    const cover = media.find(x=>x.type==='image') || media[0];
    html += `<button class="card" data-id="${esc(e.id)}">
      <div class="cover">${cover ? mediaTag(cover) : esc(e.mood || '💗')}${media.length>1?`<span class="count">+${media.length-1}</span>`:''}</div>
      <div class="card-body">
        <div class="card-date">${esc(fmtDate(e.date))}</div>
        <div class="card-title">${e.mood?`<span>${esc(e.mood)}</span>`:''}<span>${esc(e.title || '제목 없는 하루')}</span></div>
        ${e.place?`<div class="card-place">📍 ${esc(e.place)}</div>`:''}
        <div class="card-text">${esc(e.text || '')}</div>
      </div></button>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.card').forEach(c => c.onclick = () => openViewer(c.dataset.id));
}
$('#search').addEventListener('input', render);

/* ---------- viewer ---------- */
function openViewer(id){
  const e = entries.find(x=>x.id===id); if(!e) return;
  viewingId = id;
  const media = e.media || [];
  $('#vBody').innerHTML = `
    <div class="v-date">${esc(fmtDate(e.date))}</div>
    <div class="v-title">${e.mood?esc(e.mood)+' ':''}${esc(e.title || '제목 없는 하루')}</div>
    ${e.place?`<div class="v-place">📍 ${esc(e.place)}</div>`:''}
    ${media.length?`<div class="v-gallery">${media.map((m,i)=>`<div class="thumb" data-i="${i}">${mediaTag(m)}${m.type==='video'?'<span class="badge">▶ 영상</span>':''}</div>`).join('')}</div>`:''}
    ${e.text?`<div class="v-text">${esc(e.text)}</div>`:''}`;
  $('#vBody').querySelectorAll('.thumb').forEach(t => t.onclick = () => openLightbox(media, Number(t.dataset.i)));
  $('#vEdit').style.display = editable ? '' : 'none';
  $('#vDelete').style.display = editable ? '' : 'none';
  open('#viewer');
}
$('#vClose').onclick = () => close('#viewer');
$('#vEdit').onclick = () => { const e = entries.find(x=>x.id===viewingId); close('#viewer'); if(e) openEditor(e); };
$('#vDelete').onclick = () => {
  const e = entries.find(x=>x.id===viewingId); if(!e) return;
  askConfirm(`'${e.title || '이 기록'}'을(를) 삭제할까요?<br><small style="color:var(--muted)">사진·영상도 함께 지워져요.</small>`, async () => {
    try{
      await db.doc('entries/' + e.id).delete();
      for(const m of (e.media||[])) for(const id of assetIds(m)) { try{ await assets?.delete(id); }catch(_){} }
      close('#viewer'); toast('삭제했어요');
    }catch(err){ toast('삭제하지 못했어요 (' + (err.code||'오류') + ')'); }
  });
};

/* ---------- confirm ---------- */
let confirmFn = null;
function askConfirm(html, fn){ $('#confirmMsg').innerHTML = html; confirmFn = fn; open('#confirmBox'); }
$('#cNo').onclick = () => close('#confirmBox');
$('#cYes').onclick = async () => { close('#confirmBox'); if(confirmFn) await confirmFn(); };

/* ---------- lightbox ---------- */
let lbItems = [], lbIdx = 0;
function openLightbox(items, i){ lbItems = items; lbIdx = i; drawLb(); open('#lightbox'); }
let lbToken = 0;
async function drawLb(){
  const m = lbItems[lbIdx], tok = ++lbToken, box = $('#lbMedia');
  if(m.type !== 'video') box.innerHTML = `<img src="${esc(blobUrl(m.id))}" alt="">`;
  else if(!m.chunks) box.innerHTML = `<video src="${esc(blobUrl(m.id))}" controls autoplay playsinline></video>`;
  else {
    box.innerHTML = `<div class="lb-msg">영상 불러오는 중…</div>`;
    try{
      const src = await videoSrc(m, (i,n) => { if(tok===lbToken) box.innerHTML = `<div class="lb-msg">영상 불러오는 중… ${Math.round(i/n*100)}%</div>`; });
      if(tok === lbToken) box.innerHTML = `<video src="${src}" controls autoplay playsinline></video>`;
    }catch(_){ if(tok === lbToken) box.innerHTML = `<div class="lb-msg">영상을 불러오지 못했어요</div>`; }
  }
  $('#lbCount').textContent = `${lbIdx+1} / ${lbItems.length}`;
  $('#lbPrev').style.display = $('#lbNext').style.display = lbItems.length > 1 ? '' : 'none';
}
$('#lbPrev').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length; drawLb(); };
$('#lbNext').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbItems.length; drawLb(); };
$('#lbClose').onclick = () => { $('#lbMedia').innerHTML = ''; close('#lightbox'); };
$('#lightbox').addEventListener('click', e => { if(e.target.id === 'lightbox' || e.target.id === 'lbMedia'){ $('#lbMedia').innerHTML=''; close('#lightbox'); } });
document.addEventListener('keydown', e => {
  if(!$('#lightbox').classList.contains('open')) return;
  if(e.key === 'ArrowLeft') $('#lbPrev').click();
  if(e.key === 'ArrowRight') $('#lbNext').click();
  if(e.key === 'Escape') $('#lbClose').click();
});

/* ---------- editor ---------- */
let ed = null; // {id, original, media:[], newly:[], mood}
function openEditor(entry){
  if(!db){ toast('지금은 저장할 수 없는 화면이에요'); return; }
  ed = { id: entry?.id || null, original: entry, media: (entry?.media||[]).map(m=>({...m})), newly: [], mood: entry?.mood || '' };
  $('#edHeading').textContent = entry ? '기록 수정' : '새 기록';
  $('#edDate').value = entry?.date || todayStr();
  $('#edPlace').value = entry?.place || '';
  $('#edTitle').value = entry?.title || '';
  $('#edText').value = entry?.text || '';
  renderMoods(); renderEdMedia();
  open('#editor');
  setTimeout(()=>$('#edTitle').focus(), 50);
}
function renderMoods(){
  $('#moods').innerHTML = MOODS.map(m => `<button type="button" class="mood ${ed.mood===m?'on':''}" data-m="${m}">${m}</button>`).join('');
  $('#moods').querySelectorAll('.mood').forEach(b => b.onclick = () => { ed.mood = ed.mood === b.dataset.m ? '' : b.dataset.m; renderMoods(); });
}
function renderEdMedia(){
  const g = $('#edMedia');
  g.innerHTML = ed.media.map((m,i) => {
    const tag = m.preview
      ? (m.type === 'video' ? `<video src="${esc(m.preview)}#t=0.1" muted playsinline preload="metadata"></video>` : `<img src="${esc(m.preview)}" alt="">`)
      : mediaTag(m);
    return `<div class="thumb">${tag}${m.type==='video'?`<span class="badge">▶${m.size?' '+fmtMB(m.size):''}</span>`:''}${m.uploading?`<div class="prog">${esc(m.progress||'올리는 중…')}</div>`:''}<button type="button" class="x" data-i="${i}" ${m.uploading?'disabled':''} aria-label="빼기">✕</button></div>`;
  }).join('') + `<button type="button" class="add-media" id="addMedia"><b>＋</b>사진·영상</button>`;
  g.querySelectorAll('.x').forEach(b => b.onclick = () => removeEdMedia(Number(b.dataset.i)));
  $('#addMedia').onclick = () => {
    if(!assets){ toast('사진·영상은 편집 권한이 있는 사람만 올릴 수 있어요'); return; }
    $('#fileInput').click();
  };
  $('#edSave').disabled = ed.media.some(m=>m.uploading);
}
async function removeEdMedia(i){
  const m = ed.media[i]; if(!m || m.uploading) return;
  ed.media.splice(i, 1);
  for(const id of assetIds(m)) if(ed.newly.includes(id)){ ed.newly = ed.newly.filter(x=>x!==id); try{ await assets.delete(id); }catch(_){} }
  renderEdMedia();
}
async function compress(file){
  if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
    const max = 2000, r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * r), h = Math.round(bmp.height * r);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.86));
    return blob && blob.size < file.size ? blob : file;
  }catch(_){ return file; }
}
$('#fileInput').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const session = ed;
  const items = files.map(f => {
    const type = f.type.startsWith('video/') ? 'video' : 'image';
    const it = { type, preview: URL.createObjectURL(f), uploading: true, progress: '기다리는 중…' };
    if(type === 'video') it.size = f.size;
    session.media.push(it); return it;
  });
  if(ed === session) renderEdMedia();
  const redraw = () => { if(ed === session) renderEdMedia(); };
  const up = async (blob, item) => {
    if(session.cancelled) throw new Error('취소됨');
    const r = await assets.upload(blob); session.newly.push(r.id); return r.id;
  };
  for(let k = 0; k < files.length; k++){
    const f = files[k], item = items[k];
    try{
      if(item.type === 'image'){
        item.progress = '올리는 중…'; redraw();
        const blob = await compress(f);
        if(blob.size > 20 * 1024 * 1024) throw new Error('사진이 너무 커서 올릴 수 없어요');
        item.id = await up(blob, item);
      } else {
        if(f.size > MAX_VIDEO) throw new Error('영상이 너무 커요 (최대 500MB)');
        item.progress = '준비 중…'; redraw();
        const poster = await makePoster(f);
        if(poster){ try{ item.poster = await up(poster, item); }catch(err){ if(session.cancelled) throw err; } }
        item.mime = f.type || 'video/mp4';
        if(f.size <= CHUNK){
          item.progress = '올리는 중…'; redraw();
          item.id = await up(f, item);
        } else {
          const n = Math.ceil(f.size / CHUNK); item.chunks = [];
          for(let i = 0; i < n; i++){
            item.progress = `올리는 중… ${Math.round(i / n * 100)}%`; redraw();
            item.chunks.push(await up(f.slice(i * CHUNK, Math.min(f.size, (i + 1) * CHUNK), item.mime), item));
          }
        }
      }
      item.uploading = false;
      if(session.cancelled) for(const id of assetIds(item)){ try{ await assets.delete(id); }catch(_){} }
    }catch(err){
      session.media = session.media.filter(x => x !== item);
      for(const id of assetIds(item)){ try{ await assets.delete(id); }catch(_){} }
      if(!session.cancelled){
        const msg = err.code === 'storage/quota-exceeded' || /quota|exceed|limit/i.test(err.message||'') ? '저장 공간이 부족해요' : (err.message || '올리지 못했어요');
        toast((f.name || '파일') + ': ' + msg);
      }
    }
    redraw();
  }
});
$('#edCancel').onclick = async () => {
  const s = ed; ed = null; close('#editor'); if(s) s.cancelled = true;
  for(const id of (s?.newly||[])){ try{ await assets.delete(id); }catch(_){} }
};
$('#edSave').onclick = async () => {
  if(!ed || ed.media.some(m=>m.uploading)) return;
  const body = {
    date: $('#edDate').value || todayStr(),
    place: $('#edPlace').value.trim(),
    title: $('#edTitle').value.trim(),
    text: $('#edText').value,
    mood: ed.mood,
    media: ed.media.map(m => { const o = { type: m.type }; for(const k of ['id','poster','chunks','mime','size']) if(m[k] != null) o[k] = m[k]; return o; }),
    createdAt: ed.original?.createdAt || Date.now(),
    updatedAt: Date.now()
  };
  if(!body.title && !body.text && !body.media.length){ toast('제목이나 내용, 사진 중 하나는 남겨주세요'); return; }
  $('#edSave').disabled = true;
  try{
    const ref = ed.id ? db.doc('entries/' + ed.id) : db.collection('entries').doc();
    await ref.set(body);
    const keep = new Set(body.media.flatMap(assetIds));
    const removed = (ed.original?.media || []).flatMap(assetIds).filter(id => !keep.has(id));
    ed = null; close('#editor'); toast('저장했어요 💗');
    for(const id of removed){ try{ await assets?.delete(id); }catch(_){} }
  }catch(err){
    $('#edSave').disabled = false;
    if(err.code === 'permission-denied') { editable = false; toast('이 보관소에 쓸 권한이 없어요'); }
    else if(err.code === 'resource-exhausted' || err.code === 'storage/quota-exceeded') toast('저장 공간이 가득 찼어요. 오래된 기록을 정리해 주세요');
    else toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요');
  }
};

/* ---------- settings ---------- */
$('#openSettings').onclick = () => {
  if(!db){ toast('지금은 저장할 수 없는 화면이에요'); return; }
  $('#sNames').value = settings.names || ''; $('#sStart').value = settings.startDate || ''; $('#sTitle').value = settings.title || '';
  open('#settingsBox');
};
$('#sCancel').onclick = () => close('#settingsBox');
$('#sSave').onclick = async () => {
  const body = { names: $('#sNames').value.trim(), startDate: $('#sStart').value, title: $('#sTitle').value.trim() };
  try{ await db.doc('settings/main').set(body); close('#settingsBox'); toast('저장했어요'); }
  catch(err){ toast('저장하지 못했어요 (' + (err.code||'오류') + ')'); }
};

$('#newBtn').onclick = () => openEditor(null);
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', e => {
  if(e.target === o && o.id !== 'editor' && o.id !== 'lightbox' && o.id !== 'loginBox') close('#' + o.id);
}));

/* ---------- init ---------- */
$('#sLogout').onclick = async () => { try{ await firebase.auth().signOut(); }catch(_){} location.reload(); };

function startApp(){
  const timer = setTimeout(() => { if(!loaded) setStatus('기록을 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); }, 10000);
  db.collection('entries').onSnapshot(snap => {
    if(!snap.metadata.fromCache){ clearTimeout(timer); setStatus(''); }
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0) - (a.createdAt||0));
    loaded = true; render();
    if(viewingId && $('#viewer').classList.contains('open') && !entries.find(x=>x.id===viewingId)) close('#viewer');
  }, err => { clearTimeout(timer); loaded = true; setStatus('기록을 불러오지 못했어요. 로그인 상태나 Firestore 규칙을 확인해 주세요. (' + (err.code||'오류') + ')'); render(); });
  db.doc('settings/main').onSnapshot(s => { settings = s.exists ? s.data() : {}; renderHeader(); }, () => {});
}

render();
(function init(){
  if(firebaseConfig.apiKey.startsWith('YOUR')){
    loaded = true; editable = false; $('#newBtn').disabled = true;
    setStatus('firebaseConfig 값을 아직 넣지 않았어요. 파일 위쪽의 firebaseConfig에 Firebase 콘솔의 설정값을 붙여넣어 주세요.');
    render(); return;
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  db = firebase.firestore();
  const storage = firebase.storage();
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  assets = {
    async upload(blob){
      const ref = storage.ref('media/' + uid());
      await ref.put(blob, blob.type ? { contentType: blob.type } : undefined);
      return { id: await ref.getDownloadURL() };
    },
    async delete(id){ await storage.refFromURL(id).delete(); }
  };

  let started = false;
  auth.onAuthStateChanged(user => {
    if(user){
      close('#loginBox');
      if(!started){ started = true; startApp(); }
    } else {
      open('#loginBox');
    }
  });

  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('#loginMsg').textContent = ''; $('#lBtn').disabled = true;
    try{
      await auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPw').value);
    }catch(err){
      const bad = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(err.code);
      $('#loginMsg').textContent = bad ? '이메일이나 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. (' + (err.code||'오류') + ')';
    }
    $('#lBtn').disabled = false;
  });
})();
</script>
